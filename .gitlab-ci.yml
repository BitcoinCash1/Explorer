lint-frontend:
  stage: test
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run config:defaults:mempool.cash
    - npm run lint

test-build-frontend:
  stage: build
  rules:
    - if: '$CI_PROJECT_NAMESPACE == "bitcoincash" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline --omit=dev
    - npm run config:defaults:mempool.cash
    - npm run build

deploy-docker-backend:
  stage: deploy
  rules:
    - if: '$CI_PROJECT_NAMESPACE == "bitcoincash" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  tags:
    - shell
  before_script:
    - echo "${DOCKER_PASSWORD}" | docker login -u danger89 --password-stdin
      # Using the built-in variables by GitLab
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      docker build \
        --build-arg commitHash="$CI_COMMIT_SHORT_SHA" \
        -t danger89/bch-explorer-backend \
        -t $CI_REGISTRY_IMAGE/bch-explorer-backend \
        -f backend/DockerfileBCH \
        ./backend/
    - docker push danger89/bch-explorer-backend
    - docker push $CI_REGISTRY_IMAGE/bch-explorer-backend
  after_script:
    - docker logout

build-and-deploy-frontend:
  stage: build
  variables:
    NODE_ENV: production
  rules:
    - if: '$CI_PROJECT_NAMESPACE == "bitcoincash" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline --omit=dev
    - npm run config:defaults:mempool.cash
    - npm run build
  environment:
    name: production
    url: https://explorer.melroy.org
  artifacts:
    name: "Frontend Build"
    expire_in: 3 months
    paths:
      - frontend/dist/mempool/browser
