image: node:lts

stages:
  - test
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

test-backend:
  stage: test
  script:
    - cd backend
    - npm ci --cache .npm --prefer-offline
    - npm run test

lint-backend:
  stage: test
  script:
    - cd backend
    - npm ci --cache .npm --prefer-offline
    - npm run lint

build-backend:
  stage: build
  script:
    - cd backend
    - npm ci --cache .npm --prefer-offline --omit=dev
    - npm run package
    - cp healthcheck.js ./package
  artifacts:
    name: "Backend Build"
    paths:
      - backend/package

